document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

items:center;gap:16px 20px;margin-bottom:30px;\">\n            <a href=\"#autochequeo\" style=\"{{ ctaStyle }}\" style-hover=\"transform:translateY(-2px);box-shadow:0 14px 30px var(--accentSoft);\" style-focus=\"outline:3px solid var(--accent);outline-offset:3px;\">\n              <span>{{ ctaPrimary }}<\u002Fspan>\n              <span aria-hidden=\"true\" style=\"transition:transform .3s ease;\">→<\u002Fspan>\n            <\u002Fa>\n            <span style=\"font-family:'Montserrat',sans-serif;font-size:13.5px;line-height:1.5;color:var(--ink-faint);max-width:24em;\">{{ ctaNote }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <p style=\"font-family:'Barlow Semi Condensed',sans-serif;font-style:italic;font-weight:500;font-size:clamp(17px,1.5vw,21px);color:var(--ink-soft);margin:0;opacity:.9;\">Que ocupe el lugar más pequeño de tu vida.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px;animation:rise .9s ease .12s both;\">\n\n          <div aria-hidden=\"true\" style=\"position:relative;width:clamp(190px,24vw,250px);height:clamp(200px,26vw,270px);margin-bottom:30px;\">\n            <div style=\"position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:118%;height:118%;border-radius:50%;background:radial-gradient(circle, var(--lifeGlow) 0%, transparent 64%);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:84%;height:11px;border-radius:50%;background:var(--shadow);filter:blur(7px);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:6px;transform:translateX(-50%);width:74%;height:20px;border-radius:50%;border:1.5px solid var(--rim);border-bottom-color:transparent;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);animation:rimGlint 6s ease-in-out infinite;\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:14px;transform:tran :14px auto 0;max-width:26em;\">{{ counterLabel }}<\u002Fp>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n\n      <\u002Fsection>\n\n      <section id=\"autochequeo\" style=\"margin-top:clamp(40px,6vw,80px);\">\n        <p style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:14px;font-weight:600;color:var(--ink-faint);margin:0 0 22px;\">{{ cardsKicker }}<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:18px;\">\n\n          <a href=\"#\" style=\"{{ cardStyle }}\" style-hover=\"transform:translateY(-4px);border-color:var(--coral);box-shadow:0 20px 40px var(--shadow);\" style-focus=\"outline:3px solid var(--coral);outline-offset:3px;\">\n            <span style=\"display:flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;background:var(--coralSoft);color:var(--coral);font-family:'Barlow Semi Condensed';font-weight:700;font-size:20px;margin-bottom:18px;\">?<\u002Fspan>\n            <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:25px;line-height:1.05;color:var(--ink);margin:0 0 10px;\">¿Será urticaria?<\u002Fh3>\n            <p style=\"font-family:'Montserrat',sans-serif;font-weight:400;font-size:14.5px;line-height:1.58;color:var(--ink-soft);margin:0 0 20px;flex:1;\">Reconoce las señales y distingue lo agudo de lo crónico: más de 6 semanas, sin un detonante claro. Un autochequeo que te orienta, no te diagnostica.<\u002Fp>\n            <span style=\"font-family:'Barlow Semi Condensed';font-weight:600;font-size:15px;color:var(--coral);display:inline-flex;gap:7px;align-items:center;\">Hacer el autochequeo <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n\n          <a href=\"#\" style=\"{{ cardStyle }}\" style-hover=\"transform:translateY(-4px);border-color:var(--cerulean);box-shadow:0 20px 40px var(--shadow);\" style-focus=\"outline:3px solid var(--cerulean);outline-offset:3px;\">\n            <span style=\"display:flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;background:var(--ceruleanSoft);color:var(--cerulean);margin-bottom:18px;\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.6-.8L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:25px;line-height:1.05;color:var(--ink);margin:0 0 10px;\">No lo estás imaginando<\u002Fh3>\n            <p style=\"font-family:'Montserrat',sans-serif;font-weight:400;font-size:14.5px;line-height:1.58;color:var(--ink-soft);margin:0 0 20px;flex:1;\">Otras personas la viven, y aprendieron a vivirla en pequeño. Sus historias, sin filtros, para que sepas que esto tiene nombre y compañía.<\u002Fp>\n            <span style=\"font-family:'Barlow Semi Condensed';font-weight:600;font-size:15px;color:var(--cerulean);display:inline-flex;gap:7px;align-items:center;\">Leer a la comunidad <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n\n          <a href=\"#\" style=\"{{ cardStyle }}\" style-hover=\"transform:translateY(-4px);border-color:var(--jasmineLine);box-shadow:0 20px 40px var(--shadow);\" style-focus=\"outline:3px solid var(--jasmineLine);outline-offset:3px;\">\n            <span style=\"display:flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;background:var(--jasmineSoft);color:var(--jasmineInk);margin-bottom:18px;\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 9V5a3 3 0 0 0-6 0v4\"><\u002Fpath><path d=\"M5 9h14l1 12H4L5 9z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <h3 style=\"font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:25px;line-height:1.05;color:var(--ink);margin:0 0 10px;\">Hay algo más que puedes hacer<\u002Fh3>\n            <p style=\"font-family:'Montserrat',sans-serif;font-weight:400;font-size:14.5px;line-height:1.58;color:var(--ink-soft);margin:0 0 20px;flex:1;\">Lleva a tu próxima consulta las palabras justas: «¿hay algo más que podamos intentar?». Te ayudamos a prepararla.<\u002Fp>\n            <span style=\"font-family:'Barlow Semi Condensed';font-weight:600;font-size:15px;color:var(--jasmineInk);display:inline-flex;gap:7px;align-items:center;\">Preparar mi consulta <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fmain>\n\n    <footer style=\"border-top:1px solid var(--line);padding:26px 0 40px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:baseline;justify-content:space-between;\">\n      <p style=\"font-family:'Barlow Semi Condensed',sans-serif;font-style:italic;font-weight:500;font-size:18px;color:var(--ink-soft);margin:0;\">Que ocupe el lugar más pequeño de tu vida.<\u002Fp>\n      <p style=\"font-family:'Montserrat',sans-serif;font-weight:400;font-size:12px;line-height:1.55;color:var(--ink-faint);margin:0;max-width:46em;\">Este contenido es solo información general y no sustituye el consejo médico. Si tienes síntomas, habla con un profesional de la salud. Tu hora, zona y estación se detectan solo en tu dispositivo, de forma anónima.<\u002Fp>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n\n  <div role=\"group\" aria-label=\"Vista previa de contexto\" style=\"{{ switcherStyle }}\">\n    <span style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;opacity:.6;padding:0 4px;\">Vista<\u002Fspan>\n    <sc-for list=\"{{ ctxOptions }}\" as=\"opt\" hint-placeholder-count=\"6\">\n      <button type=\"button\" onclick=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;forceContext&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;dia&quot;,&quot;calor&quot;,&quot;frio&quot;,&quot;madrugada&quot;,&quot;noche-calor&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;city&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mérida&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showTexture&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.countRef = React.createRef();\n    this.kickerRef = React.createRef();\n    this.wordRef = React.createRef();\n    this.counterRef = React.createRef();\n    this.state = {\n      textureOn: props.showTexture !== false,\n      forced: null\n    };\n    this._timers = [];\n    this._raf = null;\n    this._activeCtx = null;\n    this._reduce = false;\n  }\n\n  componentDidMount(){\n    try { this._reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}\n    this.startClock();\n    this.startDynamics();\n  }\n  componentDidUpdate(){\n    const ctx = this.computeCtx();\n    if (ctx !== this._activeCtx) this.startDynamics();\n  }\n  componentWillUnmount(){ this.clearAll(); }\n\n  clearAll(){\n    this._timers.forEach(t=>clearInterval(t)); this._timers=[];\n    if(this._raf) cancelAnimationFrame(this._raf);\n  }\n\n  computeCtx(){\n    if (this.state.forced) return this.state.forced;\n    const f = this.props.forceContext;\n    if (f && f !== 'auto') return f;\n    const now = new Date();\n    const h = now.getHours();\n    const m = now.getMonth(); // 0-11\n    const winter = (m === 11 || m === 0 || m === 1);\n    const summer = (m >= 4 && m <= 8); // may-sep (calor en MX)\n    if (h >= 0 && h < 6) return summer ? 'noche-calor' : 'madrugada';\n    if (winter) return 'frio';\n    if (summer) return 'calor';\n    return 'dia';\n  }\n\n  isDark(ctx){ return ctx === 'madrugada' || ctx === 'noche-calor'; }\n  counterTarget(ctx){ return this.isDark(ctx) ? 18 : 1240; }\n\n  greeting(){\n    const h = new Date().getHours();\n    if (h < 12) return 'Buenos días';\n    if (h < 19) return 'Buenas tardes';\n    return 'Buenas noches';\n  }\n  clockText(){\n    const n = new Date();\n    let h = n.getHours(); const m = n.getMinutes();\n    const ap = h < 12 ? 'a.m.' : 'p.m.';\n    h = h % 12; if (h === 0) h = 12;\n    return h + ':' + (m<10?'0':'') + m + ' ' + ap;\n  }\n\n  fixedTime(ctx){\n    if (ctx === 'madrugada') return '3:15 a.m.';\n    if (ctx === 'noche-calor') return '9:00 p.m.';\n    return this.clockText();\n  }\n  startClock(){\n    const tick = () => {\n      const ctx = this.computeCtx();\n      if (this.isDark(ctx) && this.kickerRef.current) {\n        this.kickerRef.current.textContent = 'Son las ' + this.fixedTime(ctx);\n      }\n    };\n    tick();\n    this._timers.push(setInterval(tick, 1000 * 20));\n  }\n\n  startDynamics(){\n    this.clearAll();\n    this.startClock();\n    const ctx = this.computeCtx();\n    this._activeCtx = ctx;\n    const target = this.counterTarget(ctx);\n    const fmt = (v) => Math.round(v).toLocaleString('es-MX');\n    if (this.counterRef.current) {\n      if (this._reduce) {\n        this.counterRef.current.textContent = fmt(target);\n      } else {\n        const dur = 1500; const start = performance.now();\n        const step = (t) => {\n          const p = Math.min(1, (t - start) / dur);\n          const e = 1 - Math.pow(1 - p, 3);\n          if (this.counterRef.current) this.counterRef.current.textContent = fmt(target * e);\n          if (p < 1) this._raf = requestAnimationFrame(step);\n        };\n        this._raf = requestAnimationFrame(step);\n      }\n    }\n    // modular headline word cycle (only 'dia')\n    if (ctx === 'dia' && !this._reduce && this.wordRef.current) {\n      const words = ['la comezón', 'los brotes', 'el insomnio', 'la incertidumbre'];\n      let i = 0;\n      this._timers.push(setInterval(() => {\n        const el = this.wordRef.current; if (!el) return;\n        el.style.opacity = '0';\n        setTimeout(() => { i = (i + 1) % words.length; el.textContent = words[i]; el.style.opacity = '1'; }, 420);\n      }, 2900));\n    }\n  }\n\n  theme(ctx){\n    const T = {\n      'dia': {\n        bg:'radial-gradient(1100px 680px at 78% -8%, rgba(97,195,217,.30), transparent 60%), radial-gradient(900px 560px at 6% 108%, rgba(253,217,183,.55), transparent 58%), #f0eee6',\n        ink:'#22383f', inkSoft:'#5a6a6d', inkFaint:'#8b9698',\n        accent:'#ee7067', accentSoft:'rgba(238,112,103,.16)',\n        line:'#dcd8c9', card:'#fffdf8', cardBorder:'#e6e2d4',\n        lifeGlow:'rgba(97,195,217,.5)', bloom:'rgba(238,112,103,.22)',\n        rim:'rgba(255,255,255,.7)', rimShade:'rgba(120,150,160,.28)', shadow:'rgba(80,110,120,.22)'\n      },\n      'calor': {\n        bg:'radial-gradient(1000px 640px at 82% -6%, rgba(252,215,105,.55), transparent 58%), radial-gradient(900px 560px at 4% 106%, rgba(238,112,103,.38), transparent 56%), #fbf2e6',\n        ink:'#4a2a22', inkSoft:'#7a5448', inkFaint:'#a98a7c',\n        accent:'#e0584d', accentSoft:'rgba(224,88,77,.16)',\n        line:'#ecd9c4', card:'#fffaf2', cardBorder:'#f0dcc6',\n        lifeGlow:'rgba(252,215,105,.6)', bloom:'rgba(238,112,103,.26)',\n        rim:'rgba(255,255,255,.72)', rimShade:'rgba(180,120,80,.26)', shadow:'rgba(150,90,50,.2)'\n      },\n      'frio': {\n        bg:'radial-gradient(1000px 640px at 80% -8%, rgba(97,195,217,.42), transparent 58%), radial-gradient(900px 560px at 4% 108%, rgba(255,255,255,.85), transparent 56%), #eaf1f3',\n        ink:'#1c3b44', inkSoft:'#4f6970', inkFaint:'#85999e',\n        accent:'#0081a8', accentSoft:'rgba(0,129,168,.14)',\n        line:'#d3e0e3', card:'#fbfdfe', cardBorder:'#dde9eb',\n        lifeGlow:'rgba(97,195,217,.55)', bloom:'rgba(97,195,217,.28)',\n        rim:'rgba(255,255,255,.85)', rimShade:'rgba(90,140,155,.26)', shadow:'rgba(60,110,125,.2)'\n      },\n      'madrugada': {\n        bg:'radial-gradient(820px 620px at 76% 14%, rgba(252,215,105,.18), transparent 56%), radial-gradient(700px 540px at 70% 8%, rgba(238,112,103,.10), transparent 60%), #15151b',\n        ink:'#ece4d7', inkSoft:'#a59c8e', inkFaint:'#6f6a62',\n        accent:'#f0c24f', accentSoft:'rgba(240,194,79,.16)',\n        line:'rgba(255,255,255,.10)', card:'rgba(255,255,255,.045)', cardBorder:'rgba(255,255,255,.10)',\n        lifeGlow:'rgba(252,215,105,.32)', bloom:'rgba(240,194,79,.10)',\n        rim:'rgba(255,240,210,.5)', rimShade:'rgba(0,0,0,.4)', shadow:'rgba(0,0,0,.5)'\n      },\n      'noche-calor': {\n        bg:'radial-gradient(840px 640px at 74% 12%, rgba(238,112,103,.22), transparent 56%), radial-gradient(680px 520px at 72% 6%, rgba(252,215,105,.14), transparent 60%), #1a1418',\n        ink:'#f0e5db', inkSoft:'#ad9d92', inkFaint:'#776861',\n        accent:'#f08a72', accentSoft:'rgba(240,138,114,.18)',\n        line:'rgba(255,255,255,.10)', card:'rgba(255,255,255,.05)', cardBorder:'rgba(255,255,255,.11)',\n        lifeGlow:'rgba(238,112,103,.34)', bloom:'rgba(240,138,114,.12)',\n        rim:'rgba(255,225,205,.5)', rimShade:'rgba(0,0,0,.42)', shadow:'rgba(0,0,0,.5)'\n      }\n    };\n    return T[ctx] || T['dia'];\n  }\n\n  copy(ctx){\n    const city = this.props.city || 'Mérida';\n    const C = {\n      'dia': {\n        kicker: this.greeting(),\n        headPre:'Tu vida es más grande que ', headWord:'la comezón', headPost:' de la urticaria.',\n        sub:'Entender qué te pasa es el primer paso para que ocupe menos espacio. Te acompañamos a llegar lista a tu próxima consulta.',\n        ctaPrimary:'Descúbrelo en 1 minuto',\n        ctaNote:'Un autochequeo que te orienta. No reemplaza a tu médico.',\n        counterLabel:'personas usaron esta guía esta semana para entender qué les pasa.'\n      },\n      'calor': {\n        kicker:'En ' + city + ', ahora mismo',\n        headPre:'En ' + city + ' el calor está fuerte. Y el calor puede subir ', headWord:'los brotes', headPost:'.',\n        sub:'No es tu imaginación: el calor y la humedad despiertan la piel. Esto puede ayudarte hoy a entender qué te pasa.',\n        ctaPrimary:'Esto puede ayudarte hoy',\n        ctaNote:'Un autochequeo que te orienta. No reemplaza a tu médico.',\n        counterLabel:'personas usaron esta guía esta semana para entender qué les pasa.'\n      },\n      'frio': {\n        kicker:'Con el frío de esta temporada',\n        headPre:'Con el frío, a algunas personas la piel se les ', headWord:'brota', headPost:'.',\n        sub:'Sí, existe la urticaria por frío, y el aire seco del invierno irrita la piel. Esto ayuda a entender qué te pasa.',\n        ctaPrimary:'Entiende qué te pasa',\n        ctaNote:'Un autochequeo que te orienta. No reemplaza a tu médico.',\n        counterLabel:'personas usaron esta guía esta semana para entender qué les pasa.'\n      },\n      'madrugada': {\n        kicker:'Son las ' + this.fixedTime('madrugada'),\n        headPre:'¿No puedes ', headWord:'dormir', headPost:'?',\n        sub:'La comezón aparece justo cuando todo se queda en silencio. Respira: no estás sola, y esto pasa. Quédate, te acompañamos.',\n        ctaPrimary:'Quédate un momento',\n        ctaNote:'Sin prisa. Cuando amanezca, esto puede ayudarte a entender qué pasa.',\n        counterLabel:'personas están despiertas, leyendo esto contigo, ahora mismo.'\n      },\n      'noche-calor': {\n        kicker:'Son las ' + this.fixedTime('noche-calor'),\n        headPre:'La noche está calurosa, y la comezón no te deja ', headWord:'dormir', headPost:'.',\n        sub:'El calor de esta noche aviva la piel. Respira: no estás sola, y esto pasa. Quédate, te acompañamos.',\n        ctaPrimary:'Quédate un momento',\n        ctaNote:'Sin prisa. Cuando amanezca, esto puede ayudarte a entender qué pasa.',\n        counterLabel:'personas están despiertas, leyendo esto contigo, ahora mismo.'\n      }\n    };\n    return C[ctx] || C['dia'];\n  }\n\n  renderVals(){\n    const ctx = this.computeCtx();\n    const t = this.theme(ctx);\n    const c = this.copy(ctx);\n    const dark = this.isDark(ctx);\n\n    const shell = {\n      position:'relative', minHeight:'100vh', width:'100%', overflow:'hidden',\n      fontFamily:\"'Montserrat', sans-serif\", color:t.ink, background:t.bg,\n      transition:'background .8s ease, color .6s ease',\n      // theme vars consumed by literal var() styles in the template\n      '--ink':t.ink, '--ink-soft':t.inkSoft, '--ink-faint':t.inkFaint,\n      '--accent':t.accent, '--accentSoft':t.accentSoft,\n      '--line':t.line, '--rim':t.rim, '--rimShade':t.rimShade, '--shadow':t.shadow,\n      '--lifeGlow':t.lifeGlow, '--bloom':t.bloom,\n      '--coral': dark ? '#f08a72' : '#ee7067',\n      '--coralSoft': dark ? 'rgba(240,138,114,.16)' : 'rgba(238,112,103,.14)',\n      '--cerulean': dark ? '#5fbcd6' : '#0081a8',\n      '--ceruleanSoft': dark ? 'rgba(95,188,214,.16)' : 'rgba(0,129,168,.12)',\n      '--jasmineInk': dark ? '#f0c24f' : '#b07d0a',\n      '--jasmineSoft': dark ? 'rgba(240,194,79,.18)' : 'rgba(252,215,105,.30)',\n      '--jasmineLine': dark ? '#f0c24f' : '#e7b94a'\n    };\n\n    const glowStyle = dark ? {\n      position:'absolute', right:'14%', top:'2%', width:'min(46vw,540px)', height:'min(46vw,540px)',\n      borderRadius:'50%', zIndex:2, pointerEvents:'none',\n      background:'radial-gradient(circle, '+t.lifeGlow+' 0%, transparent 66%)',\n      filter:'blur(6px)', animation: this._reduce ? 'none' : 'lampBreathe 7s ease-in-out infinite'\n    } : { position:'absolute', inset:0, zIndex:0, pointerEvents:'none' };\n\n    const ctaBg = dark ? t.a
